# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Validate ontolint

on: [push]

permissions:
  contents: read

jobs:
  validate:
    name: validate-ontolint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install

      - name: Verify example_failure.ttl produces violations
        run: |
          poetry run scripts/ontology_qa.py tests/example_failure.ttl \
            --ctrf-dir ctrf --ctrf-filename failure-report.json \
            -e && echo "ERROR: expected violations but got none" && exit 1 || true

      - name: Verify example_pass.ttl produces no violations
        run: |
          poetry run scripts/ontology_qa.py tests/example_pass.ttl \
            --ctrf-dir ctrf --ctrf-filename pass-report.json \
            -e

      - name: Generate summary report
        run: |
          poetry run scripts/generate_custom_report.py \
            --ctrf-dir ctrf \
            --template-path templates/ctrf-report.hbs \
            --output-path out/ctrf_report.md
        if: always()

      - name: Publish report to job summary
        run: cat out/ctrf_report.md >> $GITHUB_STEP_SUMMARY
        if: always()

      - name: Upload CTRF reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctrf-reports
          path: ctrf/
