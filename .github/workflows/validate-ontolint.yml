# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Validate ontolint

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    name: validate-ontolint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install

      - name: Verify example_failure.ttl produces violations
        run: |
          poetry run scripts/ontology_qa.py tests/example_failure.ttl -e && echo "ERROR: expected violations but got none" && exit 1 || true

      - name: Verify example_pass.ttl produces no violations
        run: |
          poetry run scripts/ontology_qa.py tests/example_pass.ttl -e
