[project]
name = "ontolint"
version = "0.2.1"
description = "Get an instant, user-friendly snapshot of your ontology’s size and health, right in your CI pipeline"
authors = [
    {name = "Otello M Roscioni",email = "otello.roscioni@semanticpartners.com"}
]
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "rdflib (>=7.6.0,<8.0.0)",
    "argparse (>=1.4.0,<2.0.0)",
    "datetime (>=6.0,<7.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "networkx (>=3.2,<4.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=5.0"
ruff = ">=0.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=scripts --cov-report=xml"

[tool.coverage.run]
source = ["scripts"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
src = ["scripts", "tests"]

[tool.ruff.lint]
ignore = ["E701"]  # inline `if x: y` — intentional style in this codebase
