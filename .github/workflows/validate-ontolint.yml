# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Validate ontolint

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate-ontolint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install

      - name: Verify example_failure.ttl produces violations
        run: |
          poetry run scripts/ontology_qa.py tests/example_failure.ttl \
            --ctrf-dir ctrf --ctrf-filename failure-report.json \
            --dqv-dir ctrf --dqv-filename failure-dqv.ttl --base-uri https://example.org/qa# \
            -e && echo "ERROR: expected violations but got none" && exit 1 || true

      - name: Verify example_pass.ttl produces no violations
        run: |
          poetry run scripts/ontology_qa.py tests/example_pass.ttl \
            --ctrf-dir ctrf --ctrf-filename pass-report.json \
            --dqv-dir ctrf --dqv-filename pass-dqv.ttl --base-uri https://example.org/qa# \
            -e

      # The failure step above passes whatever the exit code, so check its DQV output
      # exists and actually reports violations.
      - name: Verify DQV reports
        run: |
          poetry run python .github/scripts/assert_dqv.py ctrf/failure-dqv.ttl --violations --datasets 1
          poetry run python .github/scripts/assert_dqv.py ctrf/pass-dqv.ttl --conforms --datasets 1

      - name: Generate summary report
        run: |
          poetry run scripts/generate_custom_report.py \
            --ctrf-dir ctrf \
            --template-path templates/ctrf-report.hbs \
            --output-path out/ctrf_report.md
        if: always()

      - name: Publish report to job summary
        run: cat out/ctrf_report.md >> $GITHUB_STEP_SUMMARY
        if: always()

      - name: Upload CTRF reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctrf-reports
          path: ctrf/

  validate-action-dqv:
    name: validate-composite-action (DQV)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Run ontolint action per file with a DQV report
        id: ontolint
        uses: ./
        with:
          ontology-paths: |
            tests/example_pass.ttl
            tests/example_failure.ttl
          per-file: 'true'
          fail-on-violations: 'false'
          dqv: 'true'
          base-uri: https://example.org/qa#
          artifact-name: ontolint-ctrf-dqv

      - name: Verify DQV report from the action's dqv-path output
        env:
          DQV_PATH: ${{ steps.ontolint.outputs.dqv-path }}
        run: |
          test -n "$DQV_PATH" || { echo "::error::dqv-path output is empty"; exit 1; }
          # One report covering both files: example_pass conforms, example_failure doesn't.
          poetry run python .github/scripts/assert_dqv.py "$DQV_PATH" --violations --datasets 2

  validate-action-single-path:
    name: validate-composite-action (single path)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Run ontolint action against example_pass.ttl with explicit config-path
        uses: ./
        with:
          ontology-paths: tests/example_pass.ttl
          fail-on-violations: 'true'
          verbose: 'true'
          config-path: .rdf-lint.yml
          artifact-name: ontolint-ctrf-single-path

  validate-action-multi-path:
    name: validate-composite-action (multiple paths)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Run ontolint action against multiple ontologies
        uses: ./
        with:
          ontology-paths: |
            tests/example_pass.ttl
            tests/example_failure.ttl
          fail-on-violations: 'false'
          verbose: 'false'
          artifact-name: ontolint-ctrf-multi-path

  validate-action-profile-only:
    name: validate-composite-action (profile-only)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Run ontolint action in profile-only mode
        uses: ./
        with:
          ontology-paths: tests/example_pass.ttl
          profile-only: 'true'
          artifact-name: ontolint-ctrf-profile-only

      - name: Assert profile-only wrote report.md
        run: test -s ctrf/report.md
