# Lint configuration for the olq vocabulary:
#   poetry run ontolint ontology/olq.ttl -e -c ontology/.rdf-lint.yml
#
# No entries are needed: the licence and spec links are objects of reference properties
# (skipped by undefined-terms), and VANN, SHACL, RDF/RDFS/OWL etc. are bundled vocabularies
# that resolve offline. DQV terms are fetched from http://www.w3.org/ns/dqv#.
