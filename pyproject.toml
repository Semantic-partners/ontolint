[project]
name = "ontology-quality-assessment"
version = "1.0.0"
description = ""
authors = [
    {name = "Otello Roscioni", email = "otello.roscioni@semanticpartners.com"}
]
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "rdflib (>=7.4.0,<8.0.0)",
    "argparse (>=1.4.0,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=5.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.coverage.run]
source = ["scripts"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
