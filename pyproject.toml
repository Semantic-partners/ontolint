[project]
name = "ontolint"
version = "0.2.1"
description = "Get an instant, user-friendly snapshot of your ontology’s size and health, right in your CI pipeline"
license = "MIT OR Apache-2.0"
authors = [
    {name = "Otello M Roscioni",email = "otello.roscioni@semanticpartners.com"}
]
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "rdflib (>=7.6.0,<8.0.0)",
    "argparse (>=1.4.0,<2.0.0)",
    "datetime (>=6.0,<7.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "networkx (>=3.2,<4.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=5.0"
ruff = ">=0.9"
# mustrd: SPARQL Given-When-Then specs (*.mustrd.ttl, listed in tests/mustrd_configuration.ttl).
# From git until a release with pytest 8 / numpy 2 support (Python 3.14) is on PyPI. The
# python range matches requires-python (mustrd needs an upper bound).
mustrd = { git = "https://github.com/Semantic-partners/mustrd.git", rev = "396a2702f2bcbde73612ff5975f239ba2f9eafbd", python = ">=3.11,<4.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# --mustrd runs the SPARQL Given-When-Then specs (*.mustrd.ttl) listed in tests/mustrd_configuration.ttl.
addopts = "-v --cov=scripts --cov-report=xml --mustrd --config=tests/mustrd_configuration.ttl"

[tool.coverage.run]
source = ["scripts"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
src = ["scripts", "tests"]

[tool.ruff.lint]
ignore = ["E701"]  # inline `if x: y` — intentional style in this codebase
