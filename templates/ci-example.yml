# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
#
# Drop this into .github/workflows/ontolint.yml in your ontology repository.
# Replace `ontologies/` with the path to your ontology file or directory.

name: Ontolint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ontolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Semantic-partners/ontolint@main
        with:
          # One path on a single line, or several paths one per line:
          #   ontology-paths: |
          #     ontologies/core.ttl
          #     ontologies/shapes.ttl
          #     ontologies/extras/
          ontology-paths: ontologies/
          # fail-on-violations: 'true'        # exit non-zero on any violation (default true)
          # verbose: 'false'                  # list violating elements per check
          # profile-only: 'false'             # skip QA checks, only report profiling metrics
          # config-path: config/ontolint.yml  # custom .rdf-lint.yml location (default: repo-root .rdf-lint.yml if present)
