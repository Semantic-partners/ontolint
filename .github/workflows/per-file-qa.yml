name: Per-file ontology QA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: ontolint-per-file
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install

      - name: Run ontolint on tests/ (per-file)
        run: |
          poetry run scripts/ontology_qa.py tests/ \
            --per-file \
            --ctrf-dir ctrf \
            -e
        continue-on-error: true

      - name: Generate summary report
        run: |
          poetry run scripts/generate_custom_report.py \
            --ctrf-dir ctrf \
            --template-path templates/ctrf-report.hbs \
            --output-path out/ctrf_report.md
        if: always()

      - name: Publish report to job summary
        run: cat out/ctrf_report.md >> $GITHUB_STEP_SUMMARY
        if: always()

      - name: Upload CTRF reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctrf-per-file-reports
          path: ctrf/
