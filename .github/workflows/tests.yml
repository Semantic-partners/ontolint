name: Tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      # Files no test reads. Not every .md is safe to skip: readme.md (test_api checks it
      # documents every Config field), the vocabularies' README.md (test_vocabularies) and
      # the expected reports in tests/data/ are all tested, so they are not listed here.
      # If these checks are ever made required in branch protection, a skipped run never
      # reports and the PR waits; switch to path filtering inside the job then.
      - 'docs/**'
      - 'examples/**'
      - 'design.md'
      - 'DEVELOPING.md'
      - 'RELEASING.md'
      - 'CLAUDE.md'
      - 'LICENSE*'
  push:
    branches: [main]
    paths-ignore:   # the same list as pull_request's
      - 'docs/**'
      - 'examples/**'
      - 'design.md'
      - 'DEVELOPING.md'
      - 'RELEASING.md'
      - 'CLAUDE.md'
      - 'LICENSE*'
  # publish.yml runs this whole workflow before it uploads anything, whatever changed.
  workflow_call:

# A newer push to a PR replaces the run for the older one. Pushes to main and releases are
# never cancelled, only queued: each is a commit someone may need a result for.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install

      - name: Lint
        run: poetry run ruff check src/ scripts/ tests/

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every cell; one failing cell must not cancel the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Every version requires-python admits, and the classifiers name.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        # git-bash on the Windows runners, so the steps read the same on both.
        shell: bash
    env:
      # One cell reports the test results and coverage, so the matrix doesn't post eight.
      REPORTING_CELL: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install

      # Coverage only where it is reported. Measuring it roughly doubles the run on
      # Python < 3.14 (no cheap sys.monitoring tracer by default), and the other cells'
      # numbers were never read. pyproject's addopts turn it on, hence --no-cov.
      - name: Run tests
        run: |
          if [ "$REPORTING_CELL" = true ]; then
            poetry run pytest \
              -n auto \
              --junitxml=test-results.xml \
              --cov=ontolint \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml
          else
            poetry run pytest -n auto --no-cov
          fi

      # ontolint as a user gets it: built into a wheel, installed non-editable into a
      # clean venv, run from outside this repo. Every step above runs against the source
      # tree, so package data missing from the wheel would pass them. Both OSes, at the
      # oldest supported Python: the platform is what changes paths and venv layout.
      - name: Smoke-test the built wheel as a consumer
        if: matrix.python-version == '3.11'
        run: ./scripts/consumer_smoke.sh

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: (success() || failure()) && env.REPORTING_CELL == 'true'
        with:
          report_paths: test-results.xml

      - name: Write coverage summary
        if: (success() || failure()) && env.REPORTING_CELL == 'true'
        run: |
          echo '## Coverage' >> $GITHUB_STEP_SUMMARY
          poetry run python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
