# .github/workflows/publish.yml
#
# Publish ontolint to PyPI. The pushed git tag is the single source of truth for what
# ships and under what version: the committed pyproject.toml version is overwritten at
# build time. Version numbers are plain ordinals, not semver promises (see RELEASING.md).
#
# Tags carry a "v" prefix, like every release of this repo since v0.1.0, so one tag
# names the same version of the GitHub Action and of the PyPI package:
#   git tag v2.1.0 <sha>
#   git push origin v2.1.0     # -> tests that SHA, publishes 2.1.0, cuts GitHub Release v2.1.0
#
# Cut a candidate / beta (PEP 440 a/b/rc suffix; pip hides these from
# `pip install ontolint` unless the user passes --pre or pins the exact version):
#   git tag v2.1.0rc1 <sha>
#   git push origin v2.1.0rc1
#
# Manual run (Actions -> Publish to PyPI -> Run workflow) re-publishes a one-off version
# without tagging (no GitHub Release is cut in that case).
#
# Rehearsing without touching real PyPI: pushing a candidate tag (e.g. v2.1.0rc1) is
# already a safe rehearsal, since pip hides pre-releases from normal installs. TestPyPI
# (https://test.pypi.org) would be a fully separate sandbox with its own account and
# token; deliberately not wired up here to keep this simple.
name: Publish to PyPI

on:
  push:
    tags:
      # A "v" then a digit is a version tag (v2.1.0, v2.1.0rc1). Anything else is ignored.
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "PEP 440 version to publish, e.g. 2.1.0 (final) or 2.1.0rc1 (beta)"
        required: true
        type: string

jobs:
  # The whole test matrix — every OS and Python version we claim, plus the wheel smoke
  # test — runs on the exact SHA being published. Nothing is uploaded unless it passes.
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
      checks: write

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the GitHub Release from the tag.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Resolve version + channel
        id: v
        run: |
          set -euo pipefail
          python -m pip install --quiet packaging
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME}"        # the pushed tag, verbatim
          else
            V="${{ github.event.inputs.version }}"
          fi
          V="${V#v}"                      # the tag's "v" is not part of the version
          # Fail fast on a typo'd tag, and normalise (e.g. 2.1.0-rc1 -> 2.1.0rc1).
          NORM="$(python -c "from packaging.version import Version; print(Version('$V'))")"
          IS_PRE="$(python -c "from packaging.version import Version; print(str(Version('$V').is_prerelease).lower())")"
          echo "version=$NORM"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRE"  >> "$GITHUB_OUTPUT"
          echo "Publishing ontolint $NORM (prerelease=$IS_PRE)"

      - name: Stamp the version onto the package
        run: poetry version "${{ steps.v.outputs.version }}"

      - name: Build (clean dist first)
        run: |
          rm -rf dist
          poetry build

      - name: Publish to PyPI
        env:
          # Poetry reads this env var as the PyPI upload token automatically.
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: poetry publish

      - name: Create GitHub Release
        # Only on a tag push — a manual dispatch has no tag to attach notes to.
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            ${{ steps.v.outputs.prerelease == 'true' && '--prerelease' || '' }}
