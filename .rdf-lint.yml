# rdf-construct lint configuration
# Place this file as .rdf-lint.yml in your project root

# Available checks:
#   - class-missing-comment
#   - class-missing-label
#   - class-same-label
#   - hijacking
#   - isolated-classes
#   - node-shape-missing-comment
#   - node-shape-missing-label
#   - node-shape-same-label
#   - owl-declaration
#   - property-missing-comment
#   - property-missing-domain-or-range
#   - property-missing-label
#   - property-same-label
#   - property-shape-missing-comment
#   - property-shape-missing-label
#   - property-shape-same-label
#   - subclass-cycles
#   - unique-identifiers
#   - untyped-class
#   - untyped-property

# Enable only specific checks (empty = all checks enabled)
# enable:
#   - owl-declaration
#   - class-missing-label
#   - property-missing-label

# Disable specific checks
# disable:
#   - hijacking
#   - isolated-classes
