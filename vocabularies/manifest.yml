# Bundled vocabularies: namespace -> file. ontolint adds each entry to imports.local, so
# these namespaces (and owl:imports of these ontologies) resolve offline. Keys are matched
# with or without a trailing '#' or '/', so one entry covers both the namespace and the
# ontology IRI. A project's own imports.local entry for the same namespace takes precedence.
#
# Sources, versions, licences and local edits are documented in README.md.

- file: rdf.ttl
  namespace: http://www.w3.org/1999/02/22-rdf-syntax-ns#
- file: rdfs.ttl
  namespace: http://www.w3.org/2000/01/rdf-schema#
- file: owl.ttl
  namespace: http://www.w3.org/2002/07/owl#
- file: xsd.ttl
  namespace: http://www.w3.org/2001/XMLSchema#
- file: shacl.ttl
  namespace: http://www.w3.org/ns/shacl#
- file: skos.ttl
  namespace: http://www.w3.org/2004/02/skos/core#
- file: dcterms.ttl
  namespace: http://purl.org/dc/terms/
- file: dc.ttl
  namespace: http://purl.org/dc/elements/1.1/
- file: dcam.ttl
  namespace: http://purl.org/dc/dcam/
- file: dctype.ttl
  namespace: http://purl.org/dc/dcmitype/
- file: foaf.ttl
  namespace: http://xmlns.com/foaf/0.1/
- file: vann.ttl
  namespace: http://purl.org/vocab/vann/
- file: vs.ttl
  namespace: http://www.w3.org/2003/06/sw-vocab-status/ns#
- file: prov.ttl
  namespace: http://www.w3.org/ns/prov#
- file: org.ttl
  namespace: http://www.w3.org/ns/org#
- file: dcat3.ttl
  namespace: http://www.w3.org/ns/dcat#
- file: vcard.ttl
  namespace: http://www.w3.org/2006/vcard/ns#
- file: schema.ttl
  namespace: http://schema.org/
- file: schema-https.ttl
  namespace: https://schema.org/
